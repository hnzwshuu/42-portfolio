[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Schema-constrained function calling with a local small LLM"
requires-python = ">=3.10,<3.14"
dependencies = [
    "llm-sdk",
    "numpy>=1.26,<3",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = ["flake8>=7,<8", "mypy>=1.13,<2"]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[tool.mypy]
exclude = ["^llm_sdk/", "^\\.venv/", "^\\.uv-cache/"]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "skip"
